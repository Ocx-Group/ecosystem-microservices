# =============================================================================
# Sealed Secrets - Templates
# =============================================================================
#
# INSTRUCCIONES:
#   1. El controller de Sealed Secrets debe estar corriendo en el cluster
#   2. Instalar kubeseal CLI:
#        brew install kubeseal   (macOS)
#        choco install kubeseal  (Windows)
#
#   3. Crear el secret normal en YAML (NO commitear este archivo):
#        kubectl create secret generic db-credentials \
#          --namespace=ecosystem \
#          --from-literal=connection-string="Host=...;Port=25060;..." \
#          --dry-run=client -o yaml > /tmp/db-credentials.yaml
#
#   4. Encriptar con kubeseal:
#        kubeseal --format=yaml \
#          --controller-namespace=sealed-secrets \
#          --controller-name=sealed-secrets-controller \
#          < /tmp/db-credentials.yaml > sealed-secrets/db-credentials.yaml
#
#   5. Commitear el archivo .yaml resultante (es seguro, está encriptado)
#
# SECRETS NECESARIOS:
#   - db-credentials        → connection-string (PostgreSQL connection string)
#   - spaces-credentials    → access-key, secret-key (DigitalOcean Spaces)
#   - registry-credentials  → .dockerconfigjson (DO Registry - generado por Terraform)
#   - brevo-credentials     → api-key (Brevo transactional email API)
#   - jwt-credentials       → key (JWT compartido por Gateway, Account y Configuration)
#   - coinpay-credentials   → secret-key, initial-token (pasarela CoinPay CR)
#   - coinpayments-credentials → key, secret, ipn-secret, merchant-id (pasarela CoinPayments)
#
# JWT:
#   - Debe generarse con un CSPRNG y contener al menos 32 bytes de entropía.
#   - El valor en claro nunca debe escribirse ni commitearse.
#   - GatewayService, AccountService y ConfigurationService consumen la misma key.
#   - La rotación requiere actualizar el SealedSecret y reiniciar coordinadamente
#     los tres deployments mediante GitOps.
#
# BREVO:
#   kubectl create secret generic brevo-credentials `
#     --namespace=ecosystem `
#     --from-literal=api-key="<BREVO_API_KEY>" `
#     --dry-run=client -o yaml > brevo-credentials.yaml
#
#   kubeseal --format=yaml `
#     --controller-namespace=sealed-secrets `
#     --controller-name=sealed-secrets-controller `
#     < brevo-credentials.yaml > sealed-secrets/brevo-credentials.yaml
#
# COINPAY:
#   Consumido por WalletService. La URL base y el UserId no son secretos y van
#   como `value:` directo en services/wallet-service/deployment.yaml.
#
#   kubectl create secret generic coinpay-credentials `
#     --namespace=ecosystem `
#     --from-literal=secret-key="<COINPAY_SECRET_KEY>" `
#     --from-literal=initial-token="<COINPAY_INITIAL_TOKEN>" `
#     --dry-run=client -o yaml > coinpay-credentials.yaml
#
#   kubeseal --format=yaml `
#     --controller-namespace=sealed-secrets `
#     --controller-name=sealed-secrets-controller `
#     < coinpay-credentials.yaml > sealed-secrets/coinpay-credentials.yaml
#
# COINPAYMENTS:
#   Consumido por WalletService. La URL base no es secreta y va como `value:` directo en
#   services/wallet-service/deployment.yaml. `ipn-secret` es el valor configurado en el panel
#   del comercio y solo se usa cuando AppSettings:ConPayments:RequireIpnSignature está en true.
#
#   kubectl create secret generic coinpayments-credentials `
#     --namespace=ecosystem `
#     --from-literal=key="<COINPAYMENTS_PUBLIC_KEY>" `
#     --from-literal=secret="<COINPAYMENTS_PRIVATE_KEY>" `
#     --from-literal=ipn-secret="<COINPAYMENTS_IPN_SECRET>" `
#     --from-literal=merchant-id="<COINPAYMENTS_MERCHANT_ID>" `
#     --dry-run=client -o yaml > coinpayments-credentials.yaml
#
#   kubeseal --format=yaml `
#     --controller-namespace=sealed-secrets `
#     --controller-name=sealed-secrets-controller `
#     < coinpayments-credentials.yaml > sealed-secrets/coinpayments-credentials.yaml
#
# SPACES:
#   kubectl create secret generic spaces-credentials `
#     --namespace=ecosystem `
#     --from-literal=access-key="<SPACES_ACCESS_KEY>" `
#     --from-literal=secret-key="<SPACES_SECRET_KEY>" `
#     --dry-run=client -o yaml > spaces-credentials.yaml
#
#   kubeseal --format=yaml `
#     --controller-namespace=sealed-secrets `
#     --controller-name=sealed-secrets-controller `
#     < spaces-credentials.yaml > sealed-secrets/spaces-credentials.yaml
#
