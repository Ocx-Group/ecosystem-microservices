apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecosystem
  labels:
    app: notification-service
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        version: "1.0.0"
    spec:
      initContainers:
        - name: wait-for-brand-configuration-contract
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - >-
              until wget -T 5 -qO-
              http://configuration-service:8080/health/contracts/brand-configuration-v1;
              do echo "Waiting for ConfigurationService brand configuration contract";
              sleep 2;
              done
      containers:
        - name: notification-service
          image: registry.digitalocean.com/ocx-registry/notification-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ASPNETCORE_GRPC_PORT
              value: "50051"
            - name: ConnectionStrings__PostgreSqlConnection
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: connection-string
            - name: RabbitMQ__Host
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: host
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: Brevo__ApiKey
              valueFrom:
                secretKeyRef:
                  name: brevo-credentials
                  key: api-key
            - name: GrpcServices__ConfigurationService
              value: "http://configuration-service:50051"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: ocx-registry
