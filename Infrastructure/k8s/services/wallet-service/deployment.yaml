apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: ecosystem
  labels:
    app: wallet-service
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
        version: "1.0.0"
    spec:
      initContainers:
        - name: wait-for-brand-configuration-contract
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - >-
              until wget -T 5 -qO-
              http://configuration-service:8080/health/contracts/brand-configuration-v2;
              do echo "Waiting for ConfigurationService brand configuration contract";
              sleep 2;
              done
      containers:
        - name: wallet-service
          image: registry.digitalocean.com/ocx-registry/wallet-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ASPNETCORE_GRPC_PORT
              value: "50051"
            - name: GrpcServices__AccountService
              value: "http://account-service:50051"
            - name: GrpcServices__InventoryService
              value: "http://inventory-service:50051"
            - name: GrpcServices__ConfigurationService
              value: "http://configuration-service:50051"
            - name: ConnectionStrings__PostgreSqlConnection
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: connection-string
            - name: ConnectionStrings__RedisConnection
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: connection-string
            - name: RabbitMQ__Host
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: host
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: AppSettings__Endpoints__CoinPayURL
              value: "https://api.coinpay.cr"
            - name: AppSettings__CoinPay__UserId
              value: "46616"
            - name: AppSettings__CoinPay__SecretKey
              valueFrom:
                secretKeyRef:
                  name: coinpay-credentials
                  key: secret-key
            - name: AppSettings__CoinPay__InitialToken
              valueFrom:
                secretKeyRef:
                  name: coinpay-credentials
                  key: initial-token
            - name: AppSettings__Endpoints__ConPaymentsURL
              value: "https://www.coinpayments.net"
            - name: AppSettings__ConPayments__Key
              valueFrom:
                secretKeyRef:
                  name: coinpayments-credentials
                  key: key
            - name: AppSettings__ConPayments__Secret
              valueFrom:
                secretKeyRef:
                  name: coinpayments-credentials
                  key: secret
            - name: AppSettings__ConPayments__IpnSecret
              valueFrom:
                secretKeyRef:
                  name: coinpayments-credentials
                  key: ipn-secret
            - name: AppSettings__ConPayments__MerchantId
              valueFrom:
                secretKeyRef:
                  name: coinpayments-credentials
                  key: merchant-id
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: ocx-registry
