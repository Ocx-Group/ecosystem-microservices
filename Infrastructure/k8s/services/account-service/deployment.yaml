apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: ecosystem
  labels:
    app: account-service
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
        version: "1.0.0"
    spec:
      initContainers:
        - name: wait-for-brand-configuration-contract
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - >-
              until wget -T 5 -qO-
              http://configuration-service:8080/health/contracts/brand-configuration-v2;
              do echo "Waiting for ConfigurationService brand configuration contract";
              sleep 2;
              done
      containers:
        - name: account-service
          image: registry.digitalocean.com/ocx-registry/account-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ASPNETCORE_GRPC_PORT
              value: "50051"
            - name: GrpcServices__ConfigurationService
              value: "http://configuration-service:50051"
            - name: GoogleAuth__ClientIds__0
              value: "378354244505-86veruf9kchr221e953erkp8jbrq8883.apps.googleusercontent.com"
            - name: GoogleAuth__ClientIds__1
              value: "378354244505-njjch822319jnpid67vbkd8gq8mnm9vq.apps.googleusercontent.com"
            - name: GoogleAuth__ClientIds__2
              value: "378354244505-og1ep1ouapeduggjj5l7r89uc9kqkg37.apps.googleusercontent.com" 
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: jwt-credentials
                  key: key
            - name: Jwt__Issuer
              value: "Ecosystem"
            - name: Jwt__Audience
              value: "Ecosystem"
            - name: ConnectionStrings__PostgreSqlConnection
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: connection-string
            - name: RabbitMQ__Host
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: host
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: ObjectStorage__AccessKey
              valueFrom:
                secretKeyRef:
                  name: spaces-credentials
                  key: access-key
            - name: ObjectStorage__SecretKey
              valueFrom:
                secretKeyRef:
                  name: spaces-credentials
                  key: secret-key
            - name: ObjectStorage__BucketName
              value: "ecosystem-storage"
            - name: ObjectStorage__Region
              value: "nyc3"
            - name: ObjectStorage__PublicBaseUrl
              value: "https://ecosystem-storage.nyc3.digitaloceanspaces.com"
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: ocx-registry
